<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Джарвис</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100dvh; background-color: #0e1621; color: #ffffff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; }
        .auth-card { background-color: #17212b; padding: 40px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .auth-card h2 { margin-top: 0; color: #5eb5f7; }
        .auth-card input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #242f3d; background-color: #0e1621; color: white; font-size: 16px; outline: none; }
        .auth-card button { width: 100%; padding: 12px; border-radius: 8px; border: none; background-color: #3b82f6; color: white; font-size: 16px; cursor: pointer; font-weight: bold; }
        .link { color: #5eb5f7; cursor: pointer; margin-top: 15px; display: block; font-size: 14px; }
        
        #chat-screen { display: none; flex-direction: column; height: 100dvh; width: 100%; }
        header { background-color: #17212b; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #242f3d; flex-shrink: 0; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        
        select { 
            background: #242f3d; color: white; border: 1px solid #4b5563; 
            padding: 5px; border-radius: 5px; font-size: 14px; outline: none; cursor: pointer;
        }
        
        .btn-icon { background: #242f3d; border: 1px solid #4b5563; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        #admin-btn { display: none; background: #dc2626; border-color: #dc2626; }
        #logout-btn { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-left: 5px; }
        
        #chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; display: flex; flex-direction: column; }
        .message.mine { align-self: flex-end; }
        .message.bot { align-self: flex-start; }
        .bubble { padding: 10px 15px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
        .mine .bubble { background-color: #2b5278; border-bottom-right-radius: 4px; }
        .bot .bubble { background-color: #182533; border-bottom-left-radius: 4px; }
        
        footer { background-color: #17212b; padding: 10px 15px; display: flex; gap: 10px; border-top: 1px solid #242f3d; flex-shrink: 0; align-items: center; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
        footer input { flex-grow: 1; padding: 12px; border-radius: 20px; border: none; background-color: #242f3d; color: white; font-size: 16px; outline: none; }
        footer button { width: 45px; height: 45px; border-radius: 50%; border: none; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        #btn-mic { background-color: #8b5cf6; }
        #btn-mic.listening { background-color: #ef4444; animation: pulse 1.5s infinite; }
        #btn-send { background-color: #3b82f6; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        #admin-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .admin-content { background: #17212b; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
        .admin-content h3 { margin-bottom: 15px; color: #ef4444; text-align: center; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #242f3d; }
        .user-row span { font-weight: bold; }
        .btn-del { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .close-modal { width: 100%; background: #4b5563; color: white; border: none; padding: 10px; border-radius: 5px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="auth-screen">
        <div class="auth-card">
            <h2>🤖 Джарвис</h2>
            <p style="color: #7f91a4; margin-bottom: 20px;">Ваш личный ассистент</p>
            <input type="text" id="username" placeholder="Имя пользователя">
            <input type="password" id="password" placeholder="Пароль">
            <button onclick="login()" id="main-btn">Войти</button>
            <span class="link" onclick="toggleMode()" id="toggle-link">Нет аккаунта? Зарегистрироваться</span>
        </div>
    </div>

    <div id="chat-screen">
        <header>
            <div class="user-info">
                <div style="width:35px; height:35px; border-radius:50%; background:#3b82f6; display:flex; align-items: center; justify-content: center; font-weight:bold;">🤖</div>
                <div>
                    <div style="font-weight:bold;">Джарвис</div>
                    <div style="font-size:12px; color:#22c55e;">● в сети</div>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="display-username" style="font-weight:bold; color:#5eb5f7; font-size: 14px;"></span>
                <select id="role-select">
                    <option value="jarvis">🎩 Дворецкий</option>
                    <option value="analyst">📊 Аналитик</option>
                </select>
                <button id="admin-btn" class="btn-icon" onclick="openAdminPanel()" title="Админ-панель">⚙️</button>
                <button id="toggle-sound-btn" class="btn-icon" onclick="toggleSound()">🔊</button>
                <button id="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </header>

        <div id="chat-container"></div>

        <footer>
            <button id="btn-mic" onclick="toggleMic()">🎤</button>
            <input type="text" id="message-input" placeholder="Напишите сообщение..." onkeypress="handleKeyPress(event)">
            <button id="btn-send" onclick="sendMessage()">➤</button>
        </footer>
    </div>

    <div id="admin-modal">
        <div class="admin-content">
            <h3>Управление пользователями</h3>
            <div id="users-list"></div>
            <button class="close-modal" onclick="document.getElementById('admin-modal').style.display='none'">Закрыть</button>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        let isSoundOn = true; 
        let isHandsFree = false; 
        let isBotSpeaking = false;
        let recognition = null;
        let silenceTimer = null;

        function speak(text) {
            return new Promise((resolve) => {
                if (!isSoundOn || !('speechSynthesis' in window)) { resolve(); return; }
                window.speechSynthesis.cancel(); 
                isBotSpeaking = true;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU'; utterance.rate = 1.05; utterance.pitch = 0.9;
                const voices = window.speechSynthesis.getVoices();
                const maleVoice = voices.find(v => v.lang.includes('ru') && v.name.toLowerCase().includes('yuri')) || voices.find(v => v.lang.includes('ru'));
                if (maleVoice) utterance.voice = maleVoice;
                utterance.onend = () => {
                    isBotSpeaking = false;
                    if (isHandsFree && recognition) {
                        silenceTimer = setTimeout(() => { try { recognition.start(); } catch(e) {} }, 1500);
                    }
                    resolve();
                };
                utterance.onerror = () => { isBotSpeaking = false; resolve(); }
                window.speechSynthesis.speak(utterance);
            });
        }

        function toggleSound() {
            isSoundOn = !isSoundOn;
            document.getElementById('toggle-sound-btn').innerText = isSoundOn ? '🔊' : '🔇';
            if (!isSoundOn) window.speechSynthesis.cancel(); 
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU'; recognition.interimResults = false;
            recognition.onstart = function() { clearTimeout(silenceTimer); document.getElementById('btn-mic').classList.add('listening'); };
            recognition.onresult = function(event) { document.getElementById('message-input').value = event.results[0][0].transcript; recognition.stop(); sendMessage(); };
            recognition.onend = function() { document.getElementById('btn-mic').classList.remove('listening'); };
        }

        function toggleMic() {
            if (!recognition) return alert("Микрофон не поддерживается.");
            if (isHandsFree) {
                isHandsFree = false; clearTimeout(silenceTimer); recognition.abort(); 
            } else {
                isHandsFree = true; window.speechSynthesis.cancel(); try { recognition.start(); } catch(e) {}
            }
        }

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('main-btn').innerText = isLoginMode ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('toggle-link').innerText = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
        }

        async function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) return alert("Заполните все поля!");

            const endpoint = isLoginMode ? '/api/login' : '/api/register';
            const res = await fetch(endpoint, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass}), credentials: 'same-origin'
            });
            
            const data = await res.json();
            if (res.ok) {
                if (!isLoginMode) {
                    alert("Регистрация успешна! Теперь войдите."); toggleMode();
                } else {
                    startChat(user, data.is_admin);
                }
            } else { alert(data.error || "Ошибка"); }
        }

        async function startChat(username, isAdmin) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('display-username').innerText = username;
            
            if (isAdmin) document.getElementById('admin-btn').style.display = 'block';
            else document.getElementById('admin-btn').style.display = 'none';

            const res = await fetch('/api/history', { credentials: 'same-origin' });
            if (res.ok) {
                const history = await res.json();
                const container = document.getElementById('chat-container');
                container.innerHTML = ''; 
                if (history.length === 0) {
                    addMessage("Здравствуйте, Сэр. Джарвис на связи. Чем я могу вам помочь?", 'bot', false);
                } else {
                    history.forEach(msg => addMessage(msg.content, msg.role === 'user' ? 'mine' : 'bot', false));
                }
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
            location.reload(); 
        }

        function addMessage(text, sender, shouldSpeak = true) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = `<div class="bubble">${text}</div>`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            if (sender === 'bot' && shouldSpeak) return speak(text); 
            return Promise.resolve();
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            const mode = document.getElementById('role-select').value; // Берем выбранный режим
            if (!text) return;

            addMessage(text, 'mine', false);
            input.value = '';
            const btnSend = document.getElementById('btn-send');
            btnSend.disabled = true; btnSend.innerText = '...';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text, mode: mode}), credentials: 'same-origin'
                });
                const data = await res.json();
                await addMessage(data.response, 'bot', true);
            } catch (e) {
                await addMessage("Ошибка соединения", 'bot', false);
            } finally {
                btnSend.disabled = false; btnSend.innerText = '➤';
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        async function openAdminPanel() {
            document.getElementById('admin-modal').style.display = 'flex';
            const listDiv = document.getElementById('users-list');
            listDiv.innerHTML = 'Загрузка...';
            
            const res = await fetch('/api/admin/users', { credentials: 'same-origin' });
            if (!res.ok) return listDiv.innerHTML = 'Ошибка доступа';
            
            const users = await res.json();
            listDiv.innerHTML = '';
            
            users.forEach(u => {
                const row = document.createElement('div');
                row.className = 'user-row';
                const btn = u === document.getElementById('display-username').innerText ? '<span style="color:#22c55e; font-size:12px;">(Вы)</span>' : `<button class="btn-del" onclick="deleteUser('${u}')">Удалить</button>`;
                row.innerHTML = `<span>${u}</span> ${btn}`;
                listDiv.appendChild(row);
            });
        }

        async function deleteUser(username) {
            if (!confirm(`Удалить пользователя ${username}?`)) return;
            const res = await fetch('/api/admin/delete_user', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: username }), credentials: 'same-origin'
            });
            if (res.ok) openAdminPanel();
            else alert("Ошибка при удалении");
        }
    </script>
</body>
</html>
